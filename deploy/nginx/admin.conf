# EVzone Rides Admin Web — static SPA hosting (HTTP, pre-certbot)
# Certbot's --nginx plugin rewrites this to add the 443 server block + redirect.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/__DOMAIN__/html;
    index index.html;

    # Allow ACME http-01 challenge for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/_letsencrypt;
    }

    # SPA client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
