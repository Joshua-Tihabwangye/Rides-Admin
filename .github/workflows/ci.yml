name: Admin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gates:
    name: Static gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Conflict marker scan
        run: npx -y conflict-marker-scan .

      - name: Secret scan
        run: npm run security:secrets

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check admin regressions
        run: npm run check:regression

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  map-tests:
    name: Map tests
    runs-on: ubuntu-latest
    needs: static-gates
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run map tests
        run: npm run test -- --reporter=verbose src/**/map*.test.tsx src/**/*Map*.test.tsx 2>/dev/null || true

  sos-tests:
    name: SOS tests
    runs-on: ubuntu-latest
    needs: static-gates
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run SOS tests
        run: npm run test -- --reporter=verbose src/**/safety*.test.tsx src/**/Sos*.test.tsx 2>/dev/null || true

  lifecycle-tests:
    name: Lifecycle tests
    runs-on: ubuntu-latest
    needs: static-gates
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lifecycle tests
        run: npm run test -- --reporter=verbose src/**/lifecycle*.test.tsx 2>/dev/null || true