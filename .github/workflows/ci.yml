name: Admin CI

on:
  push:
    branches: [master, main, Ev-Zone]
  pull_request:
    branches: [master, main, Ev-Zone]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-gates:
    name: Admin static gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Conflict marker scan
        run: |
          if grep -Rrn '<<<<<<<\|=======\|>>>>>>>' src/ scripts/ .github/; then
            echo "::error::Git conflict markers found in source files"
            exit 1
          fi

      - name: Secret scan
        run: npm run security:secrets

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
