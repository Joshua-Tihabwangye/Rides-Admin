name: Delivery CI

on:
  push:
    branches: [master, main, feature/dynamic-delivery-label-v1]
    paths:
      - 'src/**/delivery/**'
      - 'src/**/Delivery*'
      - 'src/**/delivery*'
      - 'src/**/merchant/**'
      - 'src/**/Merchant*'
      - 'src/contracts/delivery-contract-manifest.json'
      - 'scripts/generate-contracts.mjs'
      - 'scripts/check-delivery-contract-manifest.mjs'
      - 'scripts/check-admin-regressions.mjs'
      - 'scripts/secret-scan.mjs'
      - 'package*.json'
      - '.github/workflows/delivery-ci.yml'
  pull_request:
    branches: [master, main, feature/dynamic-delivery-label-v1]
    paths:
      - 'src/**/delivery/**'
      - 'src/**/Delivery*'
      - 'src/**/delivery*'
      - 'src/**/merchant/**'
      - 'src/**/Merchant*'
      - 'src/contracts/delivery-contract-manifest.json'
      - 'scripts/generate-contracts.mjs'
      - 'scripts/check-delivery-contract-manifest.mjs'
      - 'scripts/check-admin-regressions.mjs'
      - 'scripts/secret-scan.mjs'
      - 'package*.json'
      - '.github/workflows/delivery-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery-static-gates:
    name: Delivery static gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run security:secrets

      - name: Lint
        run: npm run lint

      - name: Check delivery contract manifest
        run: npm run check:delivery-contract

      - name: Check admin regressions
        run: npm run check:regression

      - name: Build
        run: npm run build
